name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set. The release build cannot be signed."
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
        echo "Keystore decoded successfully."
        ls -la keystore.jks

    - name: Restore google-services.json (Firebase Analytics/Crashlytics)
      env:
        ENCODED_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -f app/google-services.json ]; then
          echo "google-services.json found in repo — Firebase will be compiled in."
        elif [ -n "$ENCODED_GOOGLE_SERVICES" ]; then
          echo "$ENCODED_GOOGLE_SERVICES" | base64 -di > app/google-services.json
          echo "google-services.json restored from GOOGLE_SERVICES_JSON secret — Firebase will be compiled in."
        else
          echo "::warning::No google-services.json in the repo and GOOGLE_SERVICES_JSON secret is not set. The APK will be built WITHOUT Firebase Analytics/Crashlytics (empty Firebase console). Either commit app/google-services.json or add the base64-encoded file as the GOOGLE_SERVICES_JSON secret."
        fi

    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --no-daemon \
          --stacktrace

    - name: Verify APK was produced
      id: verify_apk
      run: |
        echo "=== Searching for built APK files ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
        APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No APK was produced. The build failed to generate an output artifact."
          exit 1
        fi
        echo "=== APK count: $APK_COUNT ==="

        # Store-friendly, versioned name for the universal APK (Uptodown/APKPure/
        # APKMirror submissions all want an explicit version in the filename).
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
        UNIVERSAL_APK=$(find app/build/outputs/apk -name "*universal*.apk" -type f | head -1)
        if [ -n "$UNIVERSAL_APK" ]; then
          cp "$UNIVERSAL_APK" "EpsilonMusic-v${VERSION_NAME}-universal.apk"
          echo "Renamed universal APK -> EpsilonMusic-v${VERSION_NAME}-universal.apk"
          ls -lh "EpsilonMusic-v${VERSION_NAME}-universal.apk"
        fi

        for apk in $(find app/build/outputs/apk -name "*.apk" -type f); do
          echo "APK: $apk"
          ls -lh "$apk"
        done
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

    - name: Upload Universal Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Epsilon-Music-Universal-APK
        path: |
          EpsilonMusic-v*-universal.apk
          app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f keystore.jks
        echo "Keystore cleaned up."

  build-foss:
    name: Build FOSS Release APK (F-Droid / IzzyOnDroid)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set. The release build cannot be signed."
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
        echo "Keystore decoded successfully."

    - name: Remove google-services.json (FOSS build must not apply Firebase plugins)
      run: |
        rm -f app/google-services.json
        echo "google-services.json removed — google-services/Crashlytics plugins will be skipped."

    - name: Build FOSS Release APKs
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleArm64FossRelease assembleUniversalFossRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --no-daemon \
          --stacktrace

    - name: Verify FOSS APKs were produced
      run: |
        APK_COUNT=$(find app/build/outputs/apk -name "*foss*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No FOSS APK was produced."
          exit 1
        fi
        for apk in $(find app/build/outputs/apk -name "*foss*.apk" -type f); do
          echo "APK: $apk"
          ls -lh "$apk"
        done

    - name: Upload FOSS Release APKs
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Epsilon-Music-FOSS-APK
        path: app/build/outputs/apk/**/*foss*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f keystore.jks
        echo "Keystore cleaned up."
